<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABG result-safety browser regression test</title>
<body>
<pre id="verification">RUNNING</pre>
<script src="browser-harness-guard.js"></script>
<script src="../js/calculators/acid-base.js"></script>
<script>
// Real-DOM lifecycle verification; no clinical algorithms or expectations added.
const baseline = { abgPH: "7.30", abgPCO2: "30", abgHCO3: "15", abgPaO2: "80", abgNa: "140", abgCl: "110" };
const changes = { abgPH: "7.50", abgPCO2: "60", abgHCO3: "18", abgPaO2: "90", abgNa: "142", abgCl: "108" };
const outputs = ["abgAG", "abgPrimary", "abgCompensation", "abgOxygen"];
const alerts = [];
window.alert = message => alerts.push(message);
const get = id => document.getElementById(id);
const assert = (condition, message) => { if (!condition) throw Error(message); };
const set = values => { for (const [id, value] of Object.entries(values)) get(id).value = value; };
const result = () => outputs.map(id => get(id).textContent.trim());
const inputValues = () => Object.keys(baseline).map(id => get(id).value);
const cleared = () => assert(result().every(value => value === "—"), "All results must be cleared");
const populated = () => assert(result().every(value => value && value !== "—"), "All results must be populated");
const calculate = () => get("calculateABG").click();
const dispatch = (id, event) => get(id).dispatchEvent(new Event(event, { bubbles: true }));
try {
    openABGCalculator();
    let transitions = 0;
    for (const [id, changed] of Object.entries(changes)) for (const event of ["input", "change"]) {
        alerts.length = 0; set(baseline); calculate(); populated();
        const previous = JSON.stringify(result());
        get(id).value = changed;
        const entered = JSON.stringify(inputValues());
        dispatch(id, event); cleared();
        assert(JSON.stringify(inputValues()) === entered, "Entered values must be preserved");
        assert(alerts.length === 0, "Edit must not validate or calculate");
        calculate(); populated(); assert(JSON.stringify(result()) !== previous, "Recalculation must reflect the edit");
        const updated = JSON.stringify(result());
        get(id).value = ""; dispatch(id, event); cleared(); calculate(); cleared();
        assert(alerts.length === 1, "Invalid recalculation must validate once");
        get(id).value = changed; dispatch(id, event); cleared();
        assert(alerts.length === 1, "Correction must not calculate");
        calculate(); assert(JSON.stringify(result()) === updated, "Corrected recalculation must recover");
        transitions++;
    }
    for (const id of Object.keys(baseline)) {
        alerts.length = 0; set(baseline); calculate(); populated();
        get(id).value = ""; calculate(); cleared(); assert(alerts.length === 1, "Invalid calculation must clear without edit events");
    }
    set(baseline); calculate(); get("resetABG").click(); cleared();
    assert(inputValues().every(value => value === ""), "Reset must empty inputs");
    set(baseline); calculate(); get("closeABG").click();
    assert(get("abgModal") === null, "Close must remove the dialog");
    openABGCalculator(); cleared(); assert(inputValues().every(value => value === ""), "Reopen must empty inputs");
    for (const id of Object.keys(baseline)) for (const event of ["input", "change"]) {
        set(baseline); calculate(); populated();
        get(id).value = changes[id]; dispatch(id, event); cleared();
        assert(get(id).value === changes[id], "Reopened input must be preserved");
    }
    // Independent fractional fixtures: preserve clinical prefixes and verify
    // explicit inclusive bounds, including both old rounding contradictions.
    let winterCases = 0;
    for (const [pco2, prefix] of [
        ["28.63", "Additional respiratory alkalosis."],
        ["28.65", "Appropriate respiratory compensation."],
        ["32.63", "Appropriate respiratory compensation."],
        ["32.65", "Appropriate respiratory compensation."],
        ["32.650001", "Additional respiratory acidosis."]
    ]) {
        set({ ...baseline, abgPH: "7.29", abgHCO3: "15.1", abgPCO2: pco2 });
        dispatch("abgHCO3", "input"); cleared(); calculate();
        assert(get("abgCompensation").textContent === `${prefix} Expected PaCO₂ interval 28.65–32.65 mmHg (inclusive)`, "Fractional Winter interval must agree with classification");
        winterCases++;
    }
    set({ ...baseline, abgPH: "7.33", abgHCO3: "21.9", abgPCO2: "42.85" });
    calculate();
    assert(get("abgCompensation").textContent.startsWith("Additional respiratory acidosis."), "Preserve raw floating-point classification");
    const interval = /interval ([\d.e+-]+)–([\d.e+-]+) mmHg/.exec(get("abgCompensation").textContent);
    assert(interval && Number(interval[2]) < 42.85, "Displayed bound must explain raw classification");
    for (const bound of [interval[1], interval[2]]) {
        get("abgPCO2").value = bound; dispatch("abgPCO2", "change"); cleared(); calculate();
        assert(get("abgCompensation").textContent.startsWith("Appropriate respiratory compensation."), "Raw displayed endpoints must remain inclusive");
        winterCases++;
    }
    get("resetABG").click(); cleared();
    get("closeABG").click(); openABGCalculator(); cleared();
    set({ ...baseline, abgPH: "7.29", abgHCO3: "15.1", abgPCO2: "32.63" }); calculate();
    assert(get("abgCompensation").textContent.endsWith("interval 28.65–32.65 mmHg (inclusive)"), "Reopened Winter calculation must recover");
    get("closeABG").click();
    get("verification").textContent = JSON.stringify({ status: "PASS", viewport: [innerWidth, innerHeight], transitions,
        winterCases, checks: "All six inputs, both events, preserved values, explicit recalculation, invalid recovery, reset, reopen and fractional Winter intervals" });
} catch (error) {
    get("verification").textContent = JSON.stringify({ status: "FAIL", message: error.message, stack: error.stack });
}
</script>
</body>
</html>
