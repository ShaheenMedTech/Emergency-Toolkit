name: Emergency Toolkit Tests

on:
  push:
    branches:
      - main
      - v1.3-development
      - v1.3-development-reconciled
  pull_request:
    branches:
      - main
      - v1.3-development
      - v1.3-development-reconciled

permissions:
  contents: read

jobs:
  test:
    name: Regression and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run structural smoke test
        run: python tests/smoke-test.py

      - name: Run JavaScript regression tests
        shell: bash
        run: |
          shopt -s nullglob
          tests=(tests/*-test.js)

          if ((${#tests[@]} == 0)); then
            echo "No JavaScript regression tests found."
            exit 0
          fi

          for test_file in "${tests[@]}"; do
            echo "::group::${test_file}"
            node "${test_file}"
            echo "::endgroup::"
          done

      - name: Check JavaScript syntax
        run: |
          python - <<'PYTHON'
          import pathlib, re, subprocess
          for directory in ("js", "tests"):
              for path in pathlib.Path(directory).rglob("*.js"):
                  subprocess.run(["node", "--check", str(path)], check=True)
          for path in pathlib.Path("tests").glob("*.html"):
              for script in re.findall(r"<script\b[^>]*>(.*?)</script>", path.read_text(), re.S):
                  if script.strip():
                      subprocess.run(["node", "--check"], input=script, text=True, check=True)
          PYTHON

      - name: Test Chromium runner failure handling
        run: python tests/chromium-runner-test.py

      - name: Run ABG and calculator lifecycle Chromium regressions
        run: python tests/chromium-ci-test.py --artifacts-dir artifacts/chromium

      - name: Preserve Chromium evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chromium-evidence-${{ github.sha }}
          path: artifacts/chromium/
          if-no-files-found: warn
          retention-days: 14
